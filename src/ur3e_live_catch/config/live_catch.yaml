# Parameters for the live-catch dry-run (archi §4.3, roadmap steps 1–5).
# ROS 2 parameter-file format: <node_name>: { ros__parameters: { ... } }

live_catch_node:
  ros__parameters:
    loop_hz: 60.0                 # control rate, aligned on the sim dt = 1/60 (archi §1.2)
    base_frame: "base_link"       # Isaac FirstTraining observation frame
    hoop_frame: "hoop_center"     # TF wrist_3_link -> hoop_center (static, mount geometry)
    ball_topic: "ball_state"
    joint_states_topic: "/joint_states"
    telemetry_topic: "catch_telemetry"
    units: "m"
    model_path: ""                # "" => data/models/ then dated export fallback
    stale_after_s: 0.1

    # Dry-run fallback only. Serious inference/command tests require TF
    # base_link->hoop_center from the measured or Isaac-matched hoop geometry.
    disk_pos_fallback: [0.0, 0.0, 0.5]
    disk_normal_fallback: [0.0, 0.0, 1.0]
    disk_radius: 0.05             # Current FirstTraining cfg.disk_radius

    # --- step 6: ActionMapper / safety / streaming (archi §4.3.4-§4.3.6, §8, §9) ---
    enable_command: false         # false => DRY-RUN, no robot command. true => stream to robot.
    dry_run_simulate: true        # dry-run: integrate a virtual arm tracking the policy so
                                  # the ghost moves (closed-loop preview). false => open loop.
    action_mode: "faithful"       # faithful auto-resolves current incremental metadata; safe is manual
    command_topic: "/forward_position_controller/commands"
    command_controller: "forward_position_controller"
    trajectory_controller: "scaled_joint_trajectory_controller"
    auto_switch_controller: true  # switch traj->forward controller before streaming (archi §8)
    command_substeps: 1           # legacy burst upsampling; only used when command_rate_hz <= loop_hz
    # High-rate command interpolation: the UR driver validates consecutive servoj
    # set-points every 2 ms; raw 60 Hz steps (v_safe*dt ~ 0.1 rad on wrists) are
    # rejected ("Velocity ... exceeding the joint velocity limits") and the driver
    # then ignores commands. The fast timer walks toward the 60 Hz safe target in
    # v_safe/command_rate_hz steps.
    command_rate_hz: 500.0
    # Test scale applied to metadata v_safe AND a_safe (mapper + safety).
    # 1.0 restores the trained contract; 0.5 halves speed; >1.0..4.0 is lab overdrive.
    v_safe_scale: 0.5
    # Refuse the first command of a session when |q_measured| exceeds this: catches
    # ±2π-wrapped /joint_states branches (wrist reading 6.28 rad ~ "360°" while the
    # UR controller internally sits at ~0°), which the robot rejects as a
    # full-turn jump — the 2026-07-02 pendant incident.
    start_pose_limit_rad: 3.0
    # Fallback only when policy_metadata.json lacks joint safety limits. Current
    # Isaac exports use metadata limits instead: 3.1416/3.1416/3.1416/6.2832/...
    v_safe_factor: 0.5            # fallback -> 1.571/1.571/1.571/3.142/3.142/3.142 rad/s
    a_safe: 12.5664               # fallback accel cap; metadata overrides current Isaac exports
    loop_budget_s: 0.02           # watchdog: per-tick compute budget (archi §9)
    max_tracking_error: 0.5       # rad; |q_measured - last_command| watchdog threshold
    joint_limits_path: ""         # "" => use ur_description from the currently sourced ROS distro
    # Trust a producer-supplied BallState.velocity for the observation (the
    # regression node fills it from the fit derivative; exactly-zero = not
    # provided => internal EMA finite-difference fallback).
    use_ball_state_velocity: true
    # Consumer sanity bounds: upstream bugs (bad TF, corrupt velocity) must not
    # reach the policy observation. Velocity above the bound falls back to the
    # EMA filter; a ball farther than the bound invalidates the tick.
    max_ball_speed_m_s: 12.0
    max_ball_distance_m: 4.0

test_ball_node:
  ros__parameters:
    output_topic: "ball_state"
    publish_frame: "base_link"    # base_link | <camera_frame> (parity test, archi §12)
    base_frame: "base_link"
    rate_hz: 30.0                 # perception cadence
    source: "parabola"            # parabola | csv
    trigger_mode: false           # true => idle until ~/throw (web UI "Launch virtual ball")
    noise_std: 0.0                # inject Gaussian position noise (m) to stress filtering
    dropout_prob: 0.0             # simulate detection gaps
    # Isaac FirstTraining midpoint defaults. The Web UI "Isaac random" button
    # samples the full ranges documented in firsttraining_env_cfg.py.
    p0: [-0.4, 1.65, 0.85]
    v0: [-0.05, -4.25, 0.7]
    gravity: [0.0, 0.0, -9.81]
    restart_after_s: 4.0
    # Isaac ball_on_ground parity: end a trigger-mode flight once base_link.z
    # drops below this height instead of feeding underground states to policy.
    ground_z_m: 0.05
    # camera pose in base_link (base_link<-camera), only used when publish_frame != base_link:
    camera_translation: [0.0, 0.0, 0.0]
    camera_quaternion: [0.0, 0.0, 0.0, 1.0]
    csv_path: ""

# Ballistic-regression ball publisher (Isaac "pop" parity). Enabled by the
# use_ball_regression launch arg: raw sources are re-pointed to ball_state_raw
# and this node publishes the fitted BallState on ball_state at rate_hz.
# Nothing valid is published before the start gate (min_samples/min_span_s/
# max_rms_m/speed bounds); after a dropout or near the robot the fit freezes
# and keeps predicting (coast) until ground_z_m (Isaac ball_on_ground parity).
ball_regression_node:
  ros__parameters:
    input_topic: "ball_state_raw"
    output_topic: "ball_state"
    base_frame: "base_link"       # fit frame: gravity is -z here
    units: "m"
    rate_hz: 60.0                 # output cadence, matches the policy loop
    max_stamp_age_s: 0.5          # drop raw samples with skewed stamps
    gravity_m_s2: 9.81            # FIXED in the fit (z quadratic term)
    max_samples: 240              # full-flight buffer (flights last 0.3-0.5 s)
    irls_iterations: 2            # robust (Cauchy/MAD) reweighting passes
    sigma_floor_m: 0.01
    recency_lambda: 1.0           # 0 disables recency weighting
    gate_floor_m: 0.10            # sample acceptance: max(gate_floor, gate_k*rms)
    gate_k: 3.0
    reorder_tolerance_s: 0.01
    min_sample_interval_s: 0.003  # decimate kHz-rate raw sources (trace bursts)
    # Publish-start gate ("enough support"). Keep the pop <= ~100 ms after the
    # first detection: slower gates make the ball first appear closer than the
    # Isaac spawn range (y >= 1.2 m), i.e. out of the training distribution.
    min_samples: 4
    min_span_s: 0.06
    max_rms_m: 0.035
    min_speed_m_s: 0.5            # HORIZONTAL speed floor: a static cluster can fake
                                  # an apparent vz (gravity linearization) but never vx/vy
    max_speed_m_s: 10.0
    require_approach: false       # optionally demand vy < 0 (toward the robot)
    ground_z_m: 0.05              # Isaac ball_on_ground parity
    # Pop corridor: flights may only START farther than this from base_link.
    # Real throws are born far away; near-robot pops (hands, hoop deflections)
    # would move the arm toward them.
    min_pop_distance_m: 0.6
    # Ballistic consistency monitor: abort tracks that are not in free fall
    # (a hand at 1 m/s passes the speed gate but has no -g/2 curvature).
    ballistic_check_span_s: 0.15
    ballistic_rms_ratio: 2.0
    ballistic_rms_floor_m: 0.015
    collect_timeout_s: 0.3        # give up on a cluster that never passes the gate
    max_collect_span_s: 0.5
    coast_after_s: 0.10           # freeze the fit after this sample starvation
    freeze_distance_m: 0.35       # freeze near the robot (occlusion/arm clusters)
    reject_streak_n: 4            # consistent rejected burst => new throw restart
    max_coast_s: 0.25             # end the flight after coasting this long
    coast_conf_tau_s: 0.15        # confidence decay time constant while coasting
    max_flight_s: 1.0
    refractory_s: 0.3             # ignore samples after flight end (floor bounces)
    lead_time_s: 0.0              # evaluate the fit at now + lead (prediction)

ball_float32_adapter:
  ros__parameters:
    input_topic: "ball_position_3d_mm"
    output_topic: "ball_state"
    camera_frame: "camera_optical"
    units: "mm"

ball_tracking_cpp:
  ros__parameters:
    ball_state_topic: "ball_state"
    camera_frame_id: "camera_optical"
    camera_calibration_file: "recordings/mire_calibration/intrinsics_from_mire_robust_constrained.xml"
    ball_radius_mm: 20.0
    publish_legacy_pose: true
    legacy_pose_topic: "ball_position_3d_mm"
    # Which 3D estimate feeds BallState: "trace" = outlier-filtered mid-window
    # pose from the Trace ribbon pipeline (primary algorithm, depth from trail
    # width, stamped at the sample's own event time); "circle" = legacy
    # per-detection circle-fit pose (code default for bare ros2 run).
    pose_source: "trace"
